name: Convert XCF to PNG

on:
  push:
    paths:
      - '**/*.xcf'
      - '.github/workflows/xcf-to-png.yml'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install GIMP 3.0 via Flatpak
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gimp.GIMP

      - name: Find XCF files needing PNG export
        id: find-xcf
        run: |
          > /tmp/xcf_to_convert.txt
          find docs -name "*.xcf" | while IFS= read -r xcf; do
            png="${xcf%.xcf}.png"
            if [ ! -f "$png" ]; then
              echo "$xcf" >> /tmp/xcf_to_convert.txt
            fi
          done

          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-only HEAD~1 HEAD -- '*.xcf' 2>/dev/null | while IFS= read -r xcf; do
              [ -f "$xcf" ] || continue
              grep -qxF "$xcf" /tmp/xcf_to_convert.txt || echo "$xcf" >> /tmp/xcf_to_convert.txt
            done
          fi

          count=$(wc -l < /tmp/xcf_to_convert.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Files to convert: $count"
          cat /tmp/xcf_to_convert.txt

      - name: Convert XCF files to PNG
        if: steps.find-xcf.outputs.count != '0'
        run: |
          while IFS= read -r xcf; do
            [ -f "$xcf" ] || continue
            png="${xcf%.xcf}.png"
            abs_xcf="$(pwd)/$xcf"
            abs_png="$(pwd)/$png"

            echo "Converting: $xcf -> $png"
            timeout 120 flatpak run org.gimp.GIMP -i -n \
              --batch-interpreter=plug-in-script-fu-eval \
              -b "(let* ((image (car (gimp-file-load RUN-NONINTERACTIVE \"$abs_xcf\" \"$abs_xcf\")))
                        (drawable (car (gimp-image-merge-visible-layers image CLIP-TO-IMAGE))))
                  (file-png-save RUN-NONINTERACTIVE image drawable \"$abs_png\" \"$abs_png\" 0 9 1 1 1 1 1)
                  (gimp-image-delete image))" \
              -b "(gimp-quit 0)" || {
                echo "  GIMP exited with error, retrying without sandbox..."
                timeout 120 flatpak run --no-sandboxing org.gimp.GIMP -i -n \
                  --batch-interpreter=plug-in-script-fu-eval \
                  -b "(let* ((image (car (gimp-file-load RUN-NONINTERACTIVE \"$abs_xcf\" \"$abs_xcf\")))
                            (drawable (car (gimp-image-merge-visible-layers image CLIP-TO-IMAGE))))
                      (file-png-save RUN-NONINTERACTIVE image drawable \"$abs_png\" \"$abs_png\" 0 9 1 1 1 1 1)
                      (gimp-image-delete image))" \
                  -b "(gimp-quit 0)"
              }

            if [ -f "$png" ]; then
              echo "  OK ($(du -h "$png" | cut -f1))"
            else
              echo "  FAILED: $png was not created"
              exit 1
            fi
          done < /tmp/xcf_to_convert.txt

      - name: Commit PNG files
        if: steps.find-xcf.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.png'
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "Auto-generate PNG from XCF"
            git push
          fi
