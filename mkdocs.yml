site_name: Raspberry Pi Repair Reference
site_url: https://rpi.dpetzel.info
site_description: Raspberry Pi board-level repair reference - component inventories, voltage maps, test points, and failure modes.
site_author: dpetzel

repo_url: https://github.com/dpetzel/rpi-site
repo_name: dpetzel/rpi-site
edit_uri: edit/main/docs/

watch:
  - ./docs

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social: []

